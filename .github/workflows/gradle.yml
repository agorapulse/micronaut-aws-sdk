name: Check

on: [ push, pull_request ]
jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    env:
      GRADLE_OPTS: "-Xmx6g -Xms4g"
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: 25
          distribution: zulu
      - uses: gradle/actions/setup-gradle@v4
      - run: |
          ./gradlew check --parallel --continue
      - name: Print failed test details
        if: failure()
        run: |
          set +e
          for f in $(find . -path '*/build/test-results/test/*.xml'); do
            if grep -q '<failure\|<error' "$f"; then
              echo "::group::$f"
              cat "$f"
              echo "::endgroup::"
            fi
          done
      - name: Post failures as PR comment
        if: failure() && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          set +e
          BODY="### Failing test summary (run \`${{ github.run_id }}\`)\n\n"
          for f in $(find . -path '*/build/test-results/test/*.xml'); do
            if grep -q '<failure\|<error' "$f"; then
              MODULE=$(echo "$f" | sed -E 's|^\./([^/]+)/.*|\1|; s|^\./subprojects/([^/]+)/.*|\1|; s|^\./kotlin-libs/([^/]+)/.*|\1|; s|^\./benchmarks/([^/]+)/.*|\1|')
              BODY+="\n<details><summary>$f</summary>\n\n\`\`\`xml\n"
              CONTENT=$(cat "$f" | head -c 6000)
              BODY+="${CONTENT//\`/\\\`}"
              BODY+="\n\`\`\`\n</details>\n"
            fi
          done
          printf "%b" "$BODY" > /tmp/comment.md
          wc -c /tmp/comment.md
          curl -sSL -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "Content-Type: application/json" \
            "https://api.github.com/repos/$REPO/issues/$PR_NUMBER/comments" \
            --data-binary @<(jq -Rs '{body: .}' < /tmp/comment.md)
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            **/build/reports/tests/
            **/build/test-results/
