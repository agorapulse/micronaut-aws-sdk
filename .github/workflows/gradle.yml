name: Check

on: [ push, pull_request ]
jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    env:
      GRADLE_OPTS: "-Xmx6g -Xms4g"
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: 25
          distribution: zulu
      - uses: gradle/actions/setup-gradle@v4
      - run: |
          ./gradlew check --parallel --continue
      - name: Print failed test details
        if: failure()
        run: |
          set +e
          for f in $(find . -path '*/build/test-results/test/*.xml'); do
            if grep -q '<failure\|<error' "$f"; then
              echo "::group::$f"
              cat "$f"
              echo "::endgroup::"
            fi
          done
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            **/build/reports/tests/
            **/build/test-results/
